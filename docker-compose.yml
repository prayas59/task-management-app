version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: task-manager-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_manager

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend

    container_name: task-manager-backend

    ports:
      - "5001:5001"

    env_file:
      - ./backend/.env

    depends_on:
      - postgres

  frontend:
    build: ./frontend

    container_name: task-manager-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  postgres_data:
